<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <link href="recipe.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <script src="recipe.js" defer></script>

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Title">
    <meta property="og:description" content="Your Description">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Your Title">
    <meta name="twitter:description" content="Your Description">
    <meta name="twitter:image" content="social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="recipe-book.png" alt="Recipe Book Icon" class="logo-icon">
      <span class="logo-text">RECIPEBOOK</span>
    </div>

    <div class="search-container">
      <input type="text" id="search" placeholder="Find a recipe" aria-label="Find a recipe">
      <button type="button" id="search-term" aria-label="Search">
        <img src="search.svg" alt="Search Icon">
      </button>
    </div>
  </header>

  <main>
    <div id="recipe-card">
      
    </div>
  </main>

  <footer>
    <div>
      <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
    </div>

    <div class="social">
      <a href="#" aria-label="Instagram"><img src="instagram_icon.svg" alt="instagram icon"></a>
      <a href="#" aria-label="YouTube"><img src="youtube_icon.svg" alt="youtube icon"></a>
      <a href="#" aria-label="Pinterest"><img src="pinterest_icon.svg" alt="pinterest icon"></a>
    </div>
  </footer>

  <script src="recipe.js"></script>
</body>
</html>
